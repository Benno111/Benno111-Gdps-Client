name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NDK r16b depends on the legacy ncurses 5 runtime, which is not available
    # on the current ubuntu-latest image.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install NDK r16b runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libncurses5

      - name: Set up Android NDK r16b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r16b
          add-to-path: true

      - name: Build native library
        run: ndk-build NDK_PROJECT_PATH="$GITHUB_WORKSPACE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdps-client-armeabi-v7a
          path: libs/armeabi-v7a/libgame.so
          if-no-files-found: error

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: libs/armeabi-v7a/libgame.so
